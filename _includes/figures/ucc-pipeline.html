  <svg class="wide" viewBox="0 0 960 500" role="img" aria-labelledby="ucc-pipe-t ucc-pipe-d">
    <title id="ucc-pipe-t">How the loop could respond, step by step</title>
    <desc id="ucc-pipe-d">
      A 32-second loop telling one story. Three cameras send every frame to their own motion detector pod at the edge. Frames with motion cross the
      network link to one object recognizer pod in the cloud, which sends alerts. The cloud has room for more recognizer replicas; the edge has room
      for one recognizer. A feedback loop watches the response time against an objective and has three levers: add replicas, lighter model, fewer
      frames. First it is quiet and the objective is met. Then animals keep appearing, frames queue up and response time passes the objective. The
      loop adds two replicas in the cloud; the queue drains and response time comes back under the objective. Then the link slows down and response
      time climbs again; replicas and a lighter model won't help because the delay is on the link, so the loop sends fewer frames and response time
      comes back down. Then the link is cut: the cloud is unreachable, response time spikes, and the recognizer restarts on the edge with a lighter
      model and fewer frames, bringing response time back down. An illustration of how the loop could respond, not measured data.
    </desc>

  <script>
    (function () {
      var f = document.currentScript.closest("figure"),
        svgs = f.querySelectorAll("svg"),
        b = f.querySelector(".pp"),
        cap = f.querySelector(".cap");
      var C = [
          [0, "<b>1 \u00b7 Quiet.</b> Few frames cross the link, and the objective is met."],
          [0.1, "<b>2 \u00b7 Animals keep appearing.</b> Frames queue up and response time passes the objective."],
          [0.24, "<b>3 \u00b7 The loop adds replicas in the cloud.</b> The queue drains and response time comes back down."],
          [
            0.4,
            "<b>4 \u00b7 The link slows down.</b> Response time climbs again. More compute won't help, since the delay is on the link, so the loop sends fewer frames.",
          ],
          [
            0.62,
            "<b>5 \u00b7 The link is cut.</b> The cloud is unreachable and there is no room for a replica on the edge, so the recognizer restarts on the edge with a lighter model and fewer frames.",
          ],
        ],
        last = -1,
        paused = false;
      function vis() {
        return (
          Array.prototype.find.call(svgs, function (s) {
            return s.getBoundingClientRect().width > 0;
          }) || svgs[0]
        );
      }
      function each(fn) {
        Array.prototype.forEach.call(svgs, fn);
      }
      function pause() {
        each(function (s) {
          s.pauseAnimations && s.pauseAnimations();
        });
        paused = true;
        b.textContent = "Play";
      }
      function play() {
        each(function (s) {
          s.unpauseAnimations && s.unpauseAnimations();
        });
        paused = false;
        b.textContent = "Pause";
      }
      function tick() {
        var s = vis(),
          k = ((s.getCurrentTime ? s.getCurrentTime() : 0) % 32) / 32,
          i = 0;
        for (var j = 0; j < C.length; j++) if (k >= C[j][0]) i = j;
        if (i !== last) {
          cap.innerHTML = C[i][1];
          last = i;
        }
      }
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
        each(function (s) {
          try {
            s.setCurrentTime(29);
          } catch (e) {}
        });
        pause();
      }
      tick();
      setInterval(tick, 250);
      b.addEventListener("click", function () {
        paused ? play() : pause();
      });
    })();
  </script>
